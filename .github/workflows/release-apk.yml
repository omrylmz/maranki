name: Release APK

# Cut a release by pushing a version tag:
#
#     git tag v3.1.0
#     git push origin v3.1.0
#
# CI then runs the type check, lint and test suite ONCE, and builds the
# generic app:
#
#     variant   APP_VARIANT   app              package                  APK
#     generic   generic       Maranki          com.omrylmz.maranki      maranki-<tag>.apk
#
# The German variant is NOT built here. Its decks are private and are not in
# this public repo, and an APK on the public Releases page would give them
# away. Build it on your own computer (RELEASING.md "The German decks").
#
# CI regenerates the native Android project with APP_VARIANT (Continuous
# Native Generation — `android/` is not committed; app.config.ts sets the
# package id), checks that the bundle carries no starter deck, builds a
# release APK, and keeps it as an artifact. Then a GitHub Release gets the APK.
#
# You can also trigger it manually from the Actions tab (workflow_dispatch).
# A manual run with no tag just builds and uploads the APK as an artifact;
# supply a tag to also publish a Release.
#
# Signing: read RELEASING.md "Signing keys" first. The signing step uses the
# release keystore from secrets, or (no secret) the debug key of the prebuild
# template.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v3.1.0). Leave blank to build without publishing a Release."
        required: false
        default: ""

# The built-in GITHUB_TOKEN needs write access to create the Release.
permissions:
  contents: write

# Never let two release runs race on the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Types, lint and tests
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate the release on the same checks as CI (ci.yml) — types, lint and the
      # test suite. Any red step stops the run: no green checks, no APK.
      # A tag push does not run ci.yml, so this check runs here too.
      - name: No deck file in the repo
        run: bash scripts/check-no-deck-files.sh

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint

      - name: Run tests
        run: npx jest --ci

      # Resolve the release identity WITHOUT interpolating untrusted context
      # straight into the shell (values are passed via env, then read).
      #   versionName -> the tag without its leading "v" (e.g. 3.1.0)
      #   versionCode -> the workflow run number (strictly increasing, so
      #                  Android always treats a new build as an upgrade).
      - name: Derive version info
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            RAW_TAG="$REF_NAME"
          else
            RAW_TAG="$INPUT_TAG"
          fi
          if [ -z "$RAW_TAG" ]; then
            RAW_TAG="v0.0.0-dev"
          fi
          {
            echo "tag=$RAW_TAG"
            echo "name=${RAW_TAG#v}"
            echo "code=$RUN_NUMBER"
          } >> "$GITHUB_OUTPUT"
          echo "Building $RAW_TAG (versionName=${RAW_TAG#v}, versionCode=$RUN_NUMBER)"

  build:
    name: Build Android APK (${{ matrix.variant }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Only the generic app: see the top of this file.
        variant: [generic]
    # APP_VARIANT picks the app config (name, package id: app.config.ts) and
    # the content pack Metro bundles (metro.config.js). It is set for the
    # whole job, so `expo prebuild`, the bundle check and the Gradle build
    # (which runs Metro to bundle the JS and the assets) all see it.
    env:
      APP_VARIANT: ${{ matrix.variant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Cache ~/.gradle keyed on the JS lockfile. setup-java's built-in
      # `cache: gradle` can't be used here: it hashes Gradle files to build its
      # key, but android/ is gitignored (CNG) so none exist until prebuild runs.
      # The native dependency set is fully determined by package-lock.json.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ matrix.variant }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ matrix.variant }}-
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # The generic app must never carry the German decks (spec §9.4: Metro
      # bundles only the chosen pack's files). `expo export` writes every
      # bundled asset into metadata.json, with its extension.
      - name: Check the bundled starter decks
        run: |
          npx expo export -p android --output-dir "$RUNNER_TEMP/export"
          COUNT=$(node -e "const m = require(process.argv[1]); console.log(m.fileMetadata.android.assets.filter((a) => a.ext === 'apkg').length)" "$RUNNER_TEMP/export/metadata.json")
          case "$APP_VARIANT" in
            generic) WANT=0 ;;
            *) echo "Unknown variant $APP_VARIANT"; exit 1 ;;
          esac
          echo "$APP_VARIANT bundle: $COUNT .apkg files (expected $WANT)"
          if [ "$COUNT" != "$WANT" ]; then
            echo "::error::The $APP_VARIANT bundle has $COUNT .apkg files, expected $WANT."
            exit 1
          fi

      - name: Prebuild Android project
        run: npx expo prebuild -p android --no-install

      # Optional: decode a release keystore from secrets. If it isn't set up
      # yet, the build falls back to Expo's debug signing — the APK still
      # installs by sideload, it just isn't signed with your own key.
      # Add real signing later with scripts/setup-release-keystore.sh — but
      # only as RELEASING.md "Signing keys" allows.
      - name: Decode release keystore (if configured)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "signed=true"
              echo "path=$RUNNER_TEMP/release.keystore"
            } >> "$GITHUB_OUTPUT"
            echo "Signing with the release keystore from secrets."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No ANDROID_KEYSTORE_BASE64 secret — APK will be debug-signed (still sideloadable)."
          fi

      # Version and signing are injected via Gradle properties rather than by
      # editing build.gradle, because prebuild regenerates build.gradle on
      # every run and any edit would be thrown away.
      - name: Build release APK
        working-directory: android
        env:
          SIGNED: ${{ steps.keystore.outputs.signed }}
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ needs.verify.outputs.name }}
          VERSION_CODE: ${{ needs.verify.outputs.code }}
        run: |
          ARGS=(
            "assembleRelease"
            "--no-daemon"
            "-Pandroid.injected.version.name=$VERSION_NAME"
            "-Pandroid.injected.version.code=$VERSION_CODE"
          )
          if [ "$SIGNED" = "true" ]; then
            ARGS+=(
              "-Pandroid.injected.signing.store.file=$KEYSTORE_PATH"
              "-Pandroid.injected.signing.store.password=$STORE_PASSWORD"
              "-Pandroid.injected.signing.key.alias=$KEY_ALIAS"
              "-Pandroid.injected.signing.key.password=$KEY_PASSWORD"
            )
          fi
          ./gradlew "${ARGS[@]}"

      - name: Name the APK
        id: apk
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          SRC="android/app/build/outputs/apk/release/app-release.apk"
          case "$APP_VARIANT" in
            generic) DEST="maranki-${TAG}.apk" ;;
            *) echo "Unknown variant $APP_VARIANT"; exit 1 ;;
          esac
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      # Keep a copy even on manual/unpublished runs.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.variant }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [verify, build]
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    steps:
      - name: Download the APK
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: true
          path: apks

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          ls -lh apks
          gh release create "$TAG" \
            "apks/maranki-${TAG}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Maranki $TAG" \
            --generate-notes
